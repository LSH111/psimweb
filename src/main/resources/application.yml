# 🔥 파일 업로드 설정 (YAML 형식으로 수정)
file:
  upload:
    path: ${FILE_UPLOAD_PATH:/Users/isihyeong/storage/data/upload}  # 운영 기본경로, 필요 시 환경변수로 재정의

spring:

  # 🔥 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true

  datasource:
    # PostgreSQL을 기본 설정으로 변경
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    #url: ${DB_URL:jdbc:postgresql://10.59.32.96:5432/postgres}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:ksi4788500!}  # 비밀번호는 환경변수로만 주입
    hikari:
      # PostgreSQL 기본 설정
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 180000

      # 연결 검증
      connection-test-query: "SELECT 1"
      validation-timeout: 5000

      # PostgreSQL 최적화 설정
      data-source-properties:
        stringtype: unspecified
        ApplicationName: psim-web

# MyBatis 설정
mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: com.psim.web.*.vo
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    jdbc-type-for-null: NULL
    cache-enabled: true
    lazy-loading-enabled: false
    aggressive-lazy-loading: false
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 로깅 설정
logging:
  level:
    root: INFO
    com.psim: DEBUG
    com.psim.web: DEBUG
    com.psim.web.prk.mapper: TRACE
    com.psim.web.cmm.mapper: TRACE
    com.zaxxer.hikari: INFO
    org.springframework.jdbc: DEBUG
    org.springframework.transaction: DEBUG
    org.mybatis: DEBUG
    org.apache.ibatis: TRACE
    java.sql: TRACE
    java.sql.Connection: DEBUG
    java.sql.Statement: DEBUG
    java.sql.PreparedStatement: DEBUG
    java.sql.ResultSet: TRACE
  pattern:
    console: |
      %d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{40})
      %msg%n
    file: |
      %d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{40}
      %msg%n
  file:
    name: logs/psim-web.log
    max-size: 10MB
    max-history: 30

# 서버 설정
server:
  port: ${PORT:8080}
  servlet:
    # 운영/프록시 환경에서 원하는 컨텍스트 경로를 붙일 수 있도록 환경변수로 설정
    # 기본값을 /spis 로 고정 (필요 시 SERVER_SERVLET_CONTEXT_PATH 로 덮어쓰기)
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/spis}
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 30m
      cookie:
        secure: false
        http-only: true
        same-site: lax

# Kakao API 설정
kakao:
  api:
    key: 9e769fbf1ccdb874ffffc371a19e12d8

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

